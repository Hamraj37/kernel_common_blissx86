name: Build Linux Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Clone Realtek Wireless Driver
        run: |
          git clone https://github.com/brektrou/rtl8821cu.git drivers/net/wireless/rtl8821cu

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev

      - name: Configure Kernel
        run: |
          make defconfig
          echo "CONFIG_WERROR=n" >> .config

      - name: Compile Kernel
        run: |
          make -j$(nproc)
